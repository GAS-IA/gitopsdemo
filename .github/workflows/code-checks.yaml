name: Code checks

on:
  push:
    branches:
      - main
      - master
    paths:
      - src/**
      - scripts/**
      - .github/workflows/code-checks.yaml
  pull_request:
    paths:
      - src/**
      - scripts/**
      - .github/workflows/code-checks.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and syntax checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint tools
        run: python -m pip install --upgrade ruff

      - name: Ruff lint
        run: ruff check src

      - name: Python syntax check
        run: python -m compileall -q src
