apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq
  namespace: gitops-demo-services
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: gitops-demo
type: Opaque
stringData:
  RABBITMQ_DEFAULT_USER: gitops_demo
  RABBITMQ_DEFAULT_PASS: gitops-demo-password
  RABBITMQ_ERLANG_COOKIE: gitops-demo-rabbitmq-cookie
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: rabbitmq-data
  namespace: gitops-demo-services
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: gitops-demo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: gitops-demo-services
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: gitops-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: rabbitmq
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rabbitmq
        app.kubernetes.io/part-of: gitops-demo
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          envFrom:
            - secretRef:
                name: rabbitmq
          readinessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - ping
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - rabbitmq-diagnostics
                - -q
                - status
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-data
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: gitops-demo-services
  labels:
    app.kubernetes.io/name: rabbitmq
    app.kubernetes.io/part-of: gitops-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management

